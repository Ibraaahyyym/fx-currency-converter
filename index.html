<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | FX Checker</title>
</head>
<body>
  <main>
    <header id="header">
      <div id="logo">
        <img src="./assets/images/logo.svg" alt="FX Checker">
        <span id="currencies">Currencies · EOD · ECB data</span>
      </div>
    </header>
    <section id="live-markets-container">
        <!-- Dynamic: scrolling list of currency pairs, each with its rate and 24h change (▲ up / ▼ down) -->
      <div id="live-market-header-left">
        <ul>
          <li>Live markets</li>
        </ul>
      </div>

      <div id="live-market-data-right">
        <ul id="live-market-data">
    
        </ul>
      </div>
    </section>

  </main>
<script src="/js/main.js"></script>
</body>
</html>
