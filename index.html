<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | FX Checker</title>
</head>
<body>
  <main>
    <header id="header">
      <div id="logo">
        <img src="./assets/images/logo.svg" alt="FX Checker">
      </div>
      <div id="header-right">
        <span>55 CURRENCIES · EOD · ECB DATA</span>
      </div>
    </header>

    <section id="live-markets">
        <!-- Dynamic: scrolling list of currency pairs, each with its rate and 24h change (▲ up / ▼ down) -->
         <div id="live-market-left">
          <div id="circle"></div>
          <div id="text">
            LIVE MARKETS
          </div>
         </div>

         <ul id="list-container-right"></ul>
    </section>
    <section class="content">
      <div class="converter-wrapper">
        <div id="section-title">
          CHECK THE RATE
        </div>
        <div class="converter">
          <div id="top-container">
            <div class="container"></div>
            <div class="exchange-button"></div>
            <div class="container"></div>
          </div>
          <div id="bottom-container"></div>
        </div>
      </div>

    </section>

  </main>
<script src="js/main.js"></script>
</body>
</html>
